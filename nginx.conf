server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==========================================
    # SEO 301 PERMANENT REDIRECTS (ZERO LOSS MIGRATION)
    # ==========================================
    rewrite ^/agence-de-safaris-au-nepal/?$ /a-propos/ permanent;
    rewrite ^/annapurna-region/?$ /destinations/annapurna/ permanent;
    rewrite ^/babai-valley-la-vallee-oubliee-du-nepal-sauvage/?$ /tours/bardia-babai-camping/ permanent;
    rewrite ^/bardia-ou-chitwan-safari-nepal/?$ /destinations/ permanent;
    rewrite ^/camping-jungle-nepal/?$ /tours/bardia-nuit-sauvage/ permanent;
    rewrite ^/contact/?$ /contact/ permanent;
    rewrite ^/culture-tharu-a-bardia-traditions-villages-et-vie-locale/?$ /tours/chitwan-culture/ permanent;
    rewrite ^/katmandou/?$ /destinations/katmandou/ permanent;
    rewrite ^/la-faune-du-nepal-a-la-rencontre-du-big-5-de-bardia/?$ /#galerie-faune permanent;
    rewrite ^/mentions-legales/?$ /a-propos/ permanent;
    rewrite ^/nos-aventures/?$ /tours/carnet-de-voyage/ permanent;
    rewrite ^/nos-destinations/?$ /destinations/ permanent;
    rewrite ^/nos-offres/?$ /#circuits permanent;
    rewrite ^/nos-recommandations/?$ /#faq permanent;
    rewrite ^/nos-tours-a-venir/?$ /#circuits permanent;
    rewrite ^/parc-national-de-bardia/?$ /destinations/bardia/ permanent;
    rewrite ^/parc-national-de-chitwan/?$ /destinations/chitwan/ permanent;
    rewrite ^/parc-national-de-suklaphanta/?$ /destinations/suklaphanta/ permanent;
    rewrite ^/quand-partir-au-nepal/?$ /#faq permanent;
    rewrite ^/safari-a-pied-au-nepal-est-ce-dangereux/?$ /a-propos/ permanent;
    rewrite ^/safari-au-nepal-vivre-la-jungle-autrement-loin-des-circuits-touristiques/?$ /#histoire permanent;
    rewrite ^/safari-dans-le-parc-national-de-bardia-au-nepal/?$ /destinations/bardia/ permanent;
    rewrite ^/safari-tigre-nepal/?$ /destinations/bardia/ permanent;
    rewrite ^/tour/bardia-aventure-immersive-en-jungle-et-camping-sauvage/?$ /tours/bardia-nuit-sauvage/ permanent;
    rewrite ^/tour/bardia-babai-vallee-camping-sauvage-au-coeur-dune-nature-vierge-et-isolee/?$ /tours/bardia-babai-camping/ permanent;
    rewrite ^/tour/bardia-explorateur-5-jours-dans-la-jungle/?$ /tours/bardia-explorateur/ permanent;
    rewrite ^/tour/chitwan-bardia-laventure-jungle-complete/?$ /tours/chitwan-bardia-complete/ permanent;
    rewrite ^/tour/chitwan-culture-et-jungle-sauvage/?$ /tours/chitwan-culture/ permanent;
    rewrite ^/tour/deep-into-the-wild-babai-special-experience-5-jours/?$ /tours/babai-special/ permanent;
    rewrite ^/tour/immersion-spirituelle-en-himalaya/?$ /tours/immersion-spirituelle/ permanent;
    rewrite ^/tour/jungle-extreme-special-faune-sauvage/?$ /tours/jungle-extreme/ permanent;
    rewrite ^/tour/nepal-immersion-totale-culture-vie-sauvage-et-aventure/?$ /tours/nepal-immersion-totale/ permanent;
    rewrite ^/tour/nepal-sauvage-de-la-jungle-aux-montagnes-sacrees/?$ /tours/nepal-sauvage/ permanent;
    rewrite ^/tour/nepal-special-carnet-de-voyage/?$ /tours/carnet-de-voyage/ permanent;
    rewrite ^/tour/rara-lake-bardia-expedition-lultime-aventure-hors-sentiers-battus/?$ /tours/rara-lake-bardia/ permanent;
    rewrite ^/tour/rivieres-sauvages-et-patrimoines-caches-expedition-et-rafting/?$ /tours/rafting-safari/ permanent;
    rewrite ^/tour/tiji-festival-tour-upper-mustang/?$ /tours/tiji-mustang/ permanent;
    rewrite ^/voyage-nature-au-nepal-safari-et-aventures-hors-sentiers-battus/?$ /tours/carnet-de-voyage/ permanent;

    # Redirect WordPress wp-content image links to root assets if needed
    rewrite ^/wp-content/uploads/(.*)$ /assets/$1 permanent;

    # Static Assets Caching (1 Year)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Clean URL handling (.html, directory, or fallback)
    location / {
        try_files $uri $uri/ $uri.html /index.html =404;
    }

    # Custom 404 Page
    error_page 404 /index.html;
}
